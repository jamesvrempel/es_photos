name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Ruff
        run: |
          python -m pip install --upgrade pip ruff
          ruff check .
      - name: Compile check
        run: python -m compileall -q es_photos
      - name: JSON validity
        run: |
          python - <<'PY'
          import json, pathlib, sys
          bad = 0
          for p in pathlib.Path("es_photos").rglob("*.json"):
              try:
                  json.loads(p.read_text())
              except Exception as e:
                  print("INVALID:", p, e); bad += 1
          sys.exit(1 if bad else 0)
          PY

  # ES Social is a private repository, so the server tests need a token that can read it:
  # Settings -> Secrets and variables -> Actions -> New secret "ES_SOCIAL_TOKEN"
  # (a fine-grained PAT with read-only "Contents" on jamesvrempel/es_social).
  check:
    name: Check test prerequisites
    runs-on: ubuntu-latest
    outputs:
      has_token: ${{ steps.t.outputs.has_token }}
    steps:
      - id: t
        env:
          TOKEN: ${{ secrets.ES_SOCIAL_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then echo "has_token=true" >> "$GITHUB_OUTPUT";
          else echo "has_token=false" >> "$GITHUB_OUTPUT"; echo "::notice::ES_SOCIAL_TOKEN not set - server tests skipped"; fi

  tests:
    name: Server tests (Frappe v15)
    needs: [lint, check]
    if: needs.check.outputs.has_token == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      redis-cache:
        image: redis:alpine
        ports: ["13000:6379"]
      redis-queue:
        image: redis:alpine
        ports: ["11000:6379"]
      mariadb:
        image: mariadb:10.6
        env:
          MARIADB_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=5

    steps:
      - name: Checkout ES Photos
        uses: actions/checkout@v4
        with:
          path: es_photos

      - name: Checkout ES Social
        uses: actions/checkout@v4
        with:
          repository: jamesvrempel/es_social
          token: ${{ secrets.ES_SOCIAL_TOKEN }}
          path: es_social

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install bench
        run: pip install frappe-bench

      - name: Configure MariaDB
        run: |
          mysql --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL character_set_server = 'utf8mb4'"
          mysql --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL collation_server = 'utf8mb4_unicode_ci'"

      - name: Init bench
        run: |
          bench init --skip-redis-config-generation --skip-assets --frappe-branch version-15 \
            --python "$(which python)" ~/frappe-bench

      - name: Get apps
        working-directory: /home/runner/frappe-bench
        run: |
          bench get-app es_social "$GITHUB_WORKSPACE/es_social" --skip-assets
          bench get-app es_photos "$GITHUB_WORKSPACE/es_photos" --skip-assets
          bench setup requirements --dev

      - name: Create test site
        working-directory: /home/runner/frappe-bench
        run: |
          bench new-site --db-root-password root --admin-password admin --db-host 127.0.0.1 test_site
          bench --site test_site install-app es_social
          bench --site test_site install-app es_photos
          bench --site test_site set-config allow_tests true

      - name: Run tests
        working-directory: /home/runner/frappe-bench
        run: bench --site test_site run-tests --app es_photos
