[project]
name = "es_photos"
authors = [
    { name = "Enterprise Systems Australia", email = "james.rempel@enterprisesystems.com.au" }
]
description = "Photo gallery for ES Social — albums, keywords, EXIF, slideshows and Piwigo import"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<16.0.0"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "B"]
ignore = ["E501", "W191", "E101", "B017"]

[tool.ruff.format]
indent-style = "tab"
